name: Deploy Groot AI to Cloud Run

on:
  workflow_dispatch:
    
  # push:
  #   branches:
  #     - main


jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: 'latest'
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Create Artifact Registry (groot)
        run: |
          gcloud artifacts repositories create groot \
            --repository-format=docker \
            --location=europe-west3 \
            --quiet

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/groot/groot-ai:latest .

      - name: Push Docker image to Container Registry
        run: |
          docker push europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/groot/groot-ai:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy groot-ai \
            --image europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/groot/groot-ai:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --memory "2Gi" \
            --service-account="${{ secrets.RUN_SA }}" \
            --allow-unauthenticated

      - name: Get Cloud Run Service URL
        id: cloud-run-url
        run: |
          SERVICE_URL=$(gcloud run services describe groot-ai --region ${{ secrets.GCP_REGION }} --format='value(status.url)')
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT

      - name: Print Deployment Summary to GitHub
        run: |
          IMAGE_PATH="europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/groot/groot-ai:latest"
          SERVICE_URL="${{ steps.cloud-run-url.outputs.service_url }}"
          
          echo "## 🚀 Groot Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Registry" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image Path:** \`${IMAGE_PATH}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cloud Run Service" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Service URL:** [groot-ai](${SERVICE_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ secrets.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID:** ${{ secrets.GCP_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Memory:** 2Gi" >> $GITHUB_STEP_SUMMARY
        